<!DOCTYPE html>
<html>
	<head>
		<title>Quizmasters | Music Quiz</title>
		<link rel="stylesheet" href="../../style.css">

	<body>
		<!-- Quiz question displayed here -->
		<h2 id="question"></h2>

		<div>
			<!-- Quiz answers displayed here as radio buttons -->
			<input type="radio" name="answers">
			<label for="ans1" id="ans1"></label>
			<br>
			<input type="radio" name="answers">
			<label for="ans2" id="ans2"></label>
			<br>
			<input type="radio" name="answers">
			<label for="ans3" id="ans3"></label>
			<br>
			<input type="radio" name="answers">
			<label for="ans4" id="ans4"></label>
		</div>

		<!-- Next question button displayed here -->
		<button id="submit">Next Question &#9193;</button>
	</body>
</html>
