<!DOCTYPE html>
<html>
	<head>
		<title>Quizmasters | Food and Drink Quiz</title>
		<link rel="stylesheet" href="../../style.css">
	</head>
 	
	<body>	
		<!-- Quiz question displayed here with h2 tag -->
		<h2 id="question"></h2>
		
		<div>
			<!-- Quiz answers displayed here as radio buttons -->
			<input type="radio" name="answers">
			<label for="ans1" id="ans1"></label>
			<br>
			<input type="radio" name="answers">
			<label for="ans2" id="ans2"></label>
			<br>
			<input type="radio" name="answers">
			<label for="ans3" id="ans3"></label>
			<br>
			<input type="radio" name="answers">
			<label for="ans4" id="ans4"></label>
		</div>

		<!-- Next question button displayed here -->
		<button id="submit">Next Question &#9193;</button>
	</body>

	<!-- Script tag that links to corresponding JS file -->
	<!-- Updates .innerHTML of h2 tag on line 10 for the questions and label tags on lines 15, 18, 21 and 24 for the answers -->
	<script src="foodAndDrinkQuiz.js"></script>
</html>
