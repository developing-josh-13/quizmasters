<!DOCTYPE html>
<html>
	<head>
		<title>Quizmasters | Food and Drink Quiz</title>
		<link rel="stylesheet" href="../../style.css">
	</head>
 	
	<body>
		<header>
			<nav>
				<a href="../../index.html">Home</a>
				<a href="../../howToPlay.html">How to Play</a>
				<a href="./foodAndDrinkQuiz.html">Food and Drink</a>
				<a href="../maths/mathsQuiz.html">Maths</a>
				<a href="../music/musicQuiz.html">Music</a>
				<a href="../sports/sportsQuiz.html">Sports</a>
				<a href="../technology/technologyQuiz.html">Technology</a>
			</nav>
		</header>
		
		<div class="wholepage" id="quiz">
			<!-- Displays current question -->
			<h1 id="question"></h1>

			<!-- Displays answers along with radio buttons -->
			<div class="answers">
				<input type="radio" name="answers" />
				<label for="ans1" id="ans1"></label>
			</div>
			<div class="answers">
				<input type="radio" name="answers" />
				<label for="ans2" id="ans2"></label>
			</div>
			<div class="answers">
				<input type="radio" name="answers" />
				<label for="ans3" id="ans3"></label>
			</div>
			<div class="answers">
				<input type="radio" name="answers" />
				<label for="ans4" id="ans4"></label>
			</div>

			<!-- Navigates between questions -->
			<div class="buttons">
				<button id="prev" hidden>Previous Question &#9194;</button>
				<button id="next" hidden>Next Question &#9193;</button>
			</div>

		</div>
		
		<!-- Displays final results -->
		<div class="report" id="results">
			<h1>Final Result</h1>

			<div class="answers">
				<h2>You scored:</h2>
				<p id="yourscore"></p>
				<p id="maxscore">out of 5!</p>
			</div>
			
		</div>
	
	</body>

	<!-- Link to corresponding JS file -->
	<script src="foodAndDrinkQuiz.js"></script>

</html>
